name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Renders the worktree-env scripts itself, so once per push, not per answer set.
  wt-scripts:
    name: worktree-env scripts corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: tests/test_wt_start_conf.py (psql/odoo stubbed; the live PostgreSQL case skips)
        run: uv run --no-project --with jinja2 python tests/test_wt_start_conf.py

  # Renders the kb SessionStart hook itself and runs it against a stub kb, so once per push.
  kb-hook:
    name: kb SessionStart hook corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: tests/test_kb_session_start.py (kb stubbed)
        run: uv run --no-project --with jinja2 python tests/test_kb_session_start.py

  # Builds its own bare origin and clones (plain git, nothing rendered), so once per push.
  adr-number:
    name: ADR number guard corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tests/test_adr_number.py (a local bare origin, real git)
        run: python3 tests/test_adr_number.py

  # Renders setup-ssh-access itself and runs it in scratch projects, so once per push.
  ssh-config:
    name: setup-ssh-access corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: tests/test_setup_ssh_access.py (key pair pre-made, no ssh-keygen)
        run: uv run --no-project --with jinja2 python tests/test_setup_ssh_access.py

  generate:
    runs-on: ubuntu-latest
    env:
      # the binary is the test kit (claude-code/testing): bump it on purpose, not by drift
      CLAUDE_CODE_VERSION: 2.1.299
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default-20
            args: -d project_name=ci-default
          - name: full-16
            args: >-
              -d project_name=ci-full -d odoo_version=16.0 -d use_queue_job=true
              -d custom_repo_pattern=git@github.com:acme/{}.git
              -d custom_repo_name=acme-addons
              -d module_prefix=acme -d ticket_prefix=ACME -d extra_ticket_prefixes=AI
              -d status_mcp=teams -d tickets_mcp=odoo
              -d odoo_prod_url=https://odoo.example.com -d use_pipeline=true -d use_entire=true
              -d backup_s3_bucket=acme-backups -d editor=vscode
              -d prod_ssh_host=203.0.113.1 -d prod_web_url=https://odoo.example.com
              -d prod_local_ssh_host=10.0.0.5
              -d 'test_ssh_hosts={test: 203.0.113.2, test2: 203.0.113.3}'
          - name: no-claude-18
            args: >-
              -d project_name=ci-plain -d odoo_version=18.0
              -d use_claude_code=false
          - name: repo-no-s3-17
            args: >-
              -d project_name=ci-repo -d odoo_version=17.0
              -d custom_repo_pattern=git@github.com:acme/{}.git
              -d custom_repo_name=acme-addons
          - name: py314-19
            args: >-
              -d project_name=ci-nineteen -d odoo_version=19.0
              -d python_version=3.14 -d postgres_version=18 -d use_queue_job=true
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Generate project
        run: uvx copier copy --trust --defaults --vcs-ref=HEAD ${{ matrix.args }} . /tmp/gen
      - name: Bash syntax check
        run: |
          shopt -s globstar nullglob
          for f in /tmp/gen/nix/scripts/*.sh /tmp/gen/.claude/hooks/*.sh /tmp/gen/.claude/skills/**/scripts/*.sh; do
            bash -n "$f"
          done
      - name: Mods in this render
        id: mods
        run: |
          shopt -s nullglob
          mods=(/tmp/gen/.claude/skills/*/.claude-plugin)
          echo "count=${#mods[@]}" >> "$GITHUB_OUTPUT"
      # The binary comes from the cache: every matrix job downloading it at once got 429s and
      # cut HTTP/2 streams from downloads.claude.ai. A cache miss (a new version, or one unused
      # for 7 days) downloads it once per job, retried, and caches it only once its checksum matches.
      - name: Claude Code binary (cache)
        id: claude-cache
        if: steps.mods.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/claude-code-bin
          key: claude-code-${{ env.CLAUDE_CODE_VERSION }}-linux-x64
      - name: Claude Code binary (download on a cache miss)
        if: steps.mods.outputs.count != '0' && steps.claude-cache.outputs.cache-hit != 'true'
        run: |
          base=https://downloads.claude.ai/claude-code-releases/$CLAUDE_CODE_VERSION
          # no --retry-delay: curl backs off 1s, 2s, 4s ... and waits out a 429's Retry-After
          get() { curl -fsSL --retry 6 --retry-all-errors --retry-max-time 300 "$@"; }
          get "$base/linux-x64/claude" -o /tmp/claude
          echo "$(get "$base/manifest.json" | jq -r '.platforms["linux-x64"].checksum')  /tmp/claude" | sha256sum -c -
          chmod +x /tmp/claude
          mkdir -p ~/.cache/claude-code-bin
          mv /tmp/claude ~/.cache/claude-code-bin/claude
      - name: Mods' tests (claude plugin test)
        if: steps.mods.outputs.count != '0'
        run: |
          shopt -s nullglob
          claude=~/.cache/claude-code-bin/claude
          rc=0
          for m in /tmp/gen/.claude/skills/*/.claude-plugin; do
            mod=$(dirname "$m")
            echo "::group::${mod##*/}"
            (cd "$mod" && "$claude" plugin test .) || { rc=1; echo "::error::${mod##*/}: tests failed"; }
            echo "::endgroup::"
          done
          exit $rc
      - name: settings-sync (python tests, layers parse)
        run: |
          skill=/tmp/gen/.claude/skills/settings-sync
          if [ ! -d "$skill" ]; then echo "no settings-sync in this render"; exit 0; fi
          for f in "$skill"/baseline/*.json; do python3 -m json.tool "$f" > /dev/null; done
          python3 -m unittest discover -s "$skill/tests" -p 'test_*.py'
      - name: nix flake check
        run: |
          cd /tmp/gen
          git add -A
          git -c user.email=ci@ci -c user.name=ci commit -qm init
          nix flake check
