# nixodoo-copier-template — Nix-flake Odoo development environment generator.
# Usage: copier copy --trust gh:okolovmark/nixodoo-copier-template <dst>

_subdirectory: template
_templates_suffix: .jinja
_min_copier_version: "9.0.0"

_envops:
  trim_blocks: true
  lstrip_blocks: true

# Generated once, then owned by the project: odools.toml carries a hand-tuned
# addons_paths list, the estimate calibration table carries measured actuals
# that must survive every template update, and .kb/tags.toml is the team's own
# kb area vocabulary, grown through the project's pull requests.
_skip_if_exists:
  - odools.toml
  - .claude/skills/estimate/references/calibration.md
  - .kb/tags.toml

_tasks:
  - "[ -d .git ] || git init -q"
  # Empty-but-valid uv.lock so the flake evaluates before bootstrap-deps runs.
  # Uses the system uv; any lock-format skew self-heals when bootstrap-deps
  # re-locks with the flake-pinned uv.
  - "uv lock 2>/dev/null || echo 'NOTE: uv not found — nix run .#bootstrap-deps will create uv.lock'"

# === questions ===

project_name:
  type: str
  help: Technical project name (kebab-case; used in pyproject, flake, banners)
  default: odoo-dev-env
  validator: "{% if not (project_name | regex_search('^[a-z][a-z0-9-]+$')) %}Use lowercase kebab-case (letters, digits, dashes){% elif project_name | length > 32 %}Keep it under 32 characters{% endif %}"

odoo_version:
  type: str
  help: Odoo Community version (branch of odoo/odoo)
  default: "20.0"
  choices:
    - "16.0"
    - "17.0"
    - "18.0"
    - "19.0"
    - "20.0"

python_version:
  type: str
  help: Python for the Odoo env (16 needs 3.10; 17 runs on 3.10/3.11; 18/19/20 default to 3.12; 20 refuses anything older; 19 and 20 also pin their requirements for 3.13 and 3.14, so the newest interpreter is a fine choice there; pyproject then carries uv overrides for the two pins that ship no wheel for it)
  default: "{% if odoo_version == '16.0' %}3.10{% elif odoo_version == '17.0' %}3.11{% else %}3.12{% endif %}"
  choices:
    - "3.10"
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14"
  # odoo/release.py MIN_PY_VERSION: odoo/init.py asserts it, so Odoo 20 dies on import on anything older
  validator: "{% if odoo_version == '20.0' and python_version in ['3.10', '3.11'] %}Odoo 20 needs Python 3.12 or newer{% endif %}"

postgres_version:
  type: int
  help: PostgreSQL major version (project-local cluster; Odoo 20 needs 16 or newer)
  default: "{% if odoo_version in ['16.0', '17.0'] %}15{% else %}17{% endif %}"
  choices:
    - 13
    - 14
    - 15
    - 16
    - 17
    - 18
  # odoo/release.py MIN_PG_VERSION: Odoo 20 only warns on an older server, then runs unsupported
  validator: "{% if odoo_version == '20.0' and postgres_version | int < 16 %}Odoo 20 needs PostgreSQL 16 or newer{% endif %}"

# --- ports / database (defaults derived from the Odoo major version) ---

odoo_http_port:
  type: int
  help: Odoo HTTP port
  default: "{{ (odoo_version | replace('.0', '') | int) * 100 + 69 }}"

odoo_gevent_port:
  type: int
  help: Longpolling (16) / gevent websocket (17+) port
  default: "{{ (odoo_version | replace('.0', '') | int) * 100 + 72 }}"

nginx_port:
  type: int
  help: Nginx reverse-proxy port
  default: "{{ (odoo_version | replace('.0', '') | int) * 1000 + 69 }}"

postgres_port:
  type: int
  help: PostgreSQL port
  default: "{{ (odoo_version | replace('.0', '') | int) * 1000 + 432 }}"

db_name:
  type: str
  help: Development database name
  default: develop

db_user:
  type: str
  help: PostgreSQL role for Odoo
  default: odoo

db_password:
  type: str
  help: PostgreSQL password for the Odoo role (local dev cluster)
  default: odoo

editor:
  type: str
  help: Editor configuration to generate (vscode = .vscode settings; odools.toml is always shipped with the agent layer — the find-code skill's LSP client needs it)
  default: none
  choices:
    - none
    - vscode

# --- optional integrations ---

use_queue_job:
  type: bool
  help: Wire OCA queue_job in (addons.yaml entry, server_wide_modules, [queue_job] channels)?
  default: false

queue_job_channels:
  type: str
  help: "[queue_job] channels of every odoo.conf the project writes (prod/test via create-odoo-config, each worktree session), e.g. root:3,root.ai_help:2 to give one channel a capacity of its own"
  default: "root:3"
  when: "{{ use_queue_job }}"
  validator: "{% if not (queue_job_channels | regex_search('^root[A-Za-z0-9_.:=, ]*$')) %}Channels start with root and read like root:3,root.sub:2{% endif %}"

default_repo_pattern:
  type: str
  help: Git URL pattern for addon repos in addons.yaml ('{}' is replaced by the repo key)
  default: "https://github.com/OCA/{}.git"

custom_repo_pattern:
  type: str
  help: "Git URL pattern for YOUR addons repos, '{}' replaced by the repo key (e.g. git@github.com:my-org/{}.git; empty = no custom addons repo)"
  default: ""

custom_repo_name:
  type: str
  help: Repo key of your custom addons repo (cloned to src/<name>, all its modules symlinked)
  default: "{% if custom_repo_pattern %}{{ project_name }}-addons{% endif %}"
  when: "{{ custom_repo_pattern != '' }}"

use_claude_code:
  type: bool
  help: Work in this project with Claude Code? Generates CLAUDE.md and .claude/ (guard hooks, Odoo dev skills, agents) plus the Claude Code-only parts (mods, markdown memory seed)
  default: true

# The shared instruction layer: CLAUDE.md, .claude/ (skills, agents, hooks and the
# settings.json that wires them) and odools.toml.
use_agent_layer:
  type: bool
  when: false
  default: "{{ use_claude_code }}"

module_prefix:
  type: str
  help: Technical prefix of your custom modules (used across the Claude skills and examples)
  default: "{% if project_name.split('-')[0] in ['odoo', 'base', 'web'] %}custom{% else %}{{ project_name.split('-')[0] }}{% endif %}"
  validator: "{% if not (module_prefix | regex_search('^[a-z][a-z0-9_]+$')) %}Use lowercase snake_case{% endif %}"
  when: "{{ use_agent_layer }}"

ticket_prefix:
  type: str
  help: Ticket key prefix (e.g. PROJ for PROJ-123), for commit/PR conventions and the task keys the pipeline takes into its block (with extra_ticket_prefixes, the only ones)
  default: "TASK"
  when: "{{ use_agent_layer }}"

readme_gen_source:
  type: str
  help: pip source of OCA maintainer-tools (oca-gen-addon-readme, used by the documenter agent; point at your own fork/ref for supply-chain control)
  default: "git+https://github.com/OCA/maintainer-tools@master"
  when: "{{ use_agent_layer }}"

status_mcp:
  type: str
  help: MCP used to post work status to the team (adds the my-status and teams-message skills and the Teams bootstrap questions; Teams goes through the claude.ai Microsoft 365 connector)
  default: none
  choices:
    - none
    - teams
  when: "{{ use_agent_layer }}"

tickets_mcp:
  type: str
  help: Ticket tracking in production Odoo (adds the odoo-tickets skill; ticket keys/links in statuses and the pipeline). Odoo is reached through the claude.ai Odoo connector each developer connects in claude.ai settings with their own account - nothing is installed in the project
  default: none
  choices:
    - none
    - odoo
  when: "{{ use_agent_layer }}"

odoo_prod_url:
  type: str
  help: Production Odoo base URL (ticket links; without kb, the standup's ODOO_*_PROD lines in .env)
  default: ""
  when: "{{ tickets_mcp == 'odoo' }}"

task_keys:
  type: bool
  help: Does the production Odoo run OCA project_key, so every task carries a key like PROJ-123 (field `key`)? Without it a task's reference is <ticket_prefix>-<id>, its record id behind the prefix, and the ticket skills never read `key`
  default: false
  when: "{{ tickets_mcp == 'odoo' }}"

task_software_fields:
  type: bool
  help: Does the production Odoo run project_software (project.task fields task_type, tshirt_estimate, priority_level, difficulty, knowledge_area_level, questions, answers, solution; models project.task.testcase and project.task.subtask)? It comes from okolovmark/nixodoo-addons through addons.yaml (branches 16.0 and 20.0; a project on another version needs its own port). Without it the ticket skills never read them; clarifying Q&A, the technical solution and test cases go to internal notes, and there is no checklist
  default: false
  when: "{{ tickets_mcp == 'odoo' }}"

task_timeline:
  type: bool
  help: Does the production Odoo run OCA project_timeline (project.task planned_date_start / planned_date_end)? Without it the ticket skills schedule a task by date_deadline alone
  default: false
  when: "{{ tickets_mcp == 'odoo' }}"

task_pr_uri:
  type: bool
  help: Does the production Odoo run OCA project_task_pull_request (project.task pr_uri, required before the done stage)? Without it a task closes by its stage move and the PR link goes to a Progress note
  default: false
  when: "{{ tickets_mcp == 'odoo' }}"

use_pipeline:
  type: bool
  help: Include the pipeline skill (task -> dev -> QC gate -> docs -> demo video -> PR orchestrator; runs in isolated worktree envs)?
  default: true
  when: "{{ use_agent_layer and custom_repo_pattern != '' }}"

extra_ticket_prefixes:
  type: str
  help: Other ticket key prefixes the pipeline takes as task keys besides ticket_prefix, space or comma separated (e.g. AI for a second project's AI-12); empty for none
  default: ""
  validator: "{% if extra_ticket_prefixes | regex_search('[^A-Za-z0-9 ,]') %}Letters and digits only, separated by spaces or commas{% endif %}"
  when: "{{ use_pipeline }}"

task_key_route:
  type: bool
  help: Does the production Odoo open a task by its key at /tasks/<key> (OCA project_key's controller)? The pipeline pane then links every block task to Odoo by its key, with no record URL needed.
  default: false
  when: "{{ use_pipeline and tickets_mcp == 'odoo' and odoo_prod_url != '' and task_keys }}"

use_release_notes:
  type: bool
  help: Release notes in Odoo (model release.note, a user-facing note per task, loaded unpublished from the notes/<key>.html file its PR adds and published by its Deployed by user)? The project pulls the release_notes engine from okolovmark/nixodoo-addons through addons.yaml (branches 16.0 and 20.0, the only versions this is asked for) and keeps its note files in a holder module <module_prefix>_release_notes of its own addons repo. The pipeline then writes the note after Documentation, the deploy stamps the deployer on it, a note file never voids a QC pass, and the release-note skill says how to write one
  default: false
  when: "{{ use_pipeline and tickets_mcp == 'odoo' and odoo_version in ['16.0', '20.0'] }}"

use_kb:
  type: bool
  help: SessionStart hook printing the kb knowledge-base index and standup into every Claude Code session (needs `kb` from okolovmark/kb installed; silent otherwise)?
  default: false
  when: "{{ use_agent_layer }}"

use_entire:
  type: bool
  help: Sessions recorded by the Entire CLI (entire.io)? Documents it as a prerequisite; the hooks that call it skip silently when it is not installed.
  default: false
  when: "{{ use_agent_layer }}"

backup_s3_bucket:
  type: str
  help: S3 bucket with production pg_dump backups (empty = no download-backup/aws tooling)
  default: ""

prod_ssh_host:
  type: str
  help: "Production server SSH host/IP, the `prod` alias of .ssh/config (empty = no SSH helper tooling; after changing a host answer, rerun `nix run .#setup-ssh-access`)"
  default: ""

prod_ssh_user:
  type: str
  help: Production server SSH user
  default: ubuntu
  when: "{{ prod_ssh_host != '' }}"

prod_local_ssh_host:
  type: str
  help: "Production box's address on the office LAN when it differs from prod_ssh_host (adds a `prod-local` alias beside `prod`; empty = none)"
  default: ""
  when: "{{ prod_ssh_host != '' }}"

prod_web_url:
  type: str
  help: Production web URL (shown by the prod-server helper)
  default: ""
  when: "{{ prod_ssh_host != '' }}"

# Where THIS project lives on the prod/test box — the same generated env, checked
# out there, which is what the deploy and prod-ops skills pull, update, restart
# and run shell scripts against. Asked only when those skills ship; the questions
# exist because a box that predates the project (or serves several) can lay
# things out differently.
prod_remote_project_dir:
  type: str
  help: Path of this project's checkout on the prod/test box
  default: "~/{{ project_name }}"
  when: "{{ prod_ssh_host != '' and use_agent_layer and custom_repo_name }}"

prod_remote_odoo_conf:
  type: str
  help: Odoo config file on the prod/test box
  default: "{{ prod_remote_project_dir }}/odoo.conf"
  when: "{{ prod_ssh_host != '' and use_agent_layer and custom_repo_name }}"

prod_db_name:
  type: str
  help: Database name on the prod box
  default: odoo
  when: "{{ prod_ssh_host != '' and use_agent_layer and custom_repo_name }}"

prod_link_addons_cmd:
  type: str
  help: Command run from the box's project dir to re-link addon symlinks (deploy --link-addons)
  default: "nix run .#update-repos"
  when: "{{ prod_ssh_host != '' and use_agent_layer and custom_repo_name }}"

# Test boxes: one SSH alias per entry, all sharing the user and port below. A
# single box is `{test: 203.0.113.2}`; a per-developer fleet is
# `{odoo1.kepi: 192.168.20.112, odoo2.kepi: 192.168.20.113}`. Every alias goes
# into .ssh/config, `test-server <alias>` (dev-server profile) connects, and the deploy
# and prod-ops scripts accept it as their host argument.
test_ssh_hosts:
  type: yaml
  help: "Test boxes as a YAML mapping alias -> host/IP, e.g. {test: 203.0.113.2} (empty = no test-server helper)"
  default: {}
  when: "{{ prod_ssh_host != '' }}"

test_ssh_user:
  type: str
  help: SSH user on the test boxes
  default: ubuntu
  when: "{% if test_ssh_hosts %}true{% else %}false{% endif %}"

test_ssh_port:
  type: int
  help: SSH port on the test boxes
  default: 22
  when: "{% if test_ssh_hosts %}true{% else %}false{% endif %}"

test_web_url:
  type: str
  help: "Web URL of a test box as the test-server helper prints it; `{alias}` stands for the box's alias (e.g. http://{alias}:8069/web; empty = not shown)"
  default: ""
  when: "{% if test_ssh_hosts %}true{% else %}false{% endif %}"

test_db_name:
  type: str
  help: "Database name on a test box, used when the deploy / prod-ops scripts get a test alias as host; `{alias}` stands for the box's alias, `{short}` for the alias up to its first dot (e.g. {short}: odoo1.kepi -> odoo1)"
  default: "{{ prod_db_name }}"
  when: "{% if test_ssh_hosts and use_agent_layer and custom_repo_name %}true{% else %}false{% endif %}"

project_dir_var:
  type: str
  help: Name of the env variable holding the project root (make it unique if you run two projects on the same Odoo version)
  default: "ODOO{{ odoo_version | replace('.0', '') }}_PROJECT_DIR"
  validator: "{% if not (project_dir_var | regex_search('^[A-Z][A-Z0-9_]*$')) %}Use an UPPER_SNAKE_CASE shell variable name{% endif %}"

service_suffix:
  type: str
  help: "Suffix for the systemd unit names and the nix profile, so two generated projects can coexist on one machine. Empty keeps the classic names (odoo.service, postgres.service, nginx.service, odoo-logrotate.*, odoo-wt@.service) and the user's default ~/.nix-profile. Set e.g. '-19' for odoo-19.service etc.; the project then also gets its own nix profile at ~/.local/state/nix/profiles/<project_name> (never on PATH: generated commands call odoo through it)"
  default: ""
  validator: "{% if service_suffix and not (service_suffix | regex_search('^-?[a-z0-9][a-z0-9-]*$')) %}Use lowercase letters, digits and dashes, e.g. -19{% endif %}"

# === computed (hidden) ===

# The nix profile this project's dev/test/prod-server package is installed into,
# relative to $HOME: the user's default profile unless service_suffix asks for a
# per-project one. Used as %h/{{ nix_profile_rel }} in units and $HOME/{{ nix_profile_rel }} in scripts.
nix_profile_rel:
  type: str
  when: false
  default: "{% if service_suffix %}.local/state/nix/profiles/{{ project_name }}{% else %}.nix-profile{% endif %}"

# What goes between `nix profile add ` and `.#dev-server` (trailing space included, or empty).
nix_profile_flag:
  type: str
  when: false
  default: "{% if service_suffix %}--profile ~/{{ nix_profile_rel }} {% endif %}"

# How generated docs and skills invoke Odoo: bare `odoo` from PATH with the default
# profile, the per-project profile's wrapper otherwise (that profile is not on PATH).
odoo_cmd:
  type: str
  when: false
  default: "{% if service_suffix %}~/{{ nix_profile_rel }}/bin/odoo{% else %}odoo{% endif %}"

# Development runs in worktree envs only: no main Odoo, no reverse proxy, no main
# database. True wherever the worktree-env skill is generated (Claude Code and a
# custom addons repo); a project without it keeps the main dev env it has to have.
dev_in_worktrees:
  type: bool
  when: false
  default: "{{ use_agent_layer and custom_repo_name != '' }}"


odoo_major:
  type: str
  when: false
  default: "{{ odoo_version | replace('.0', '') }}"
